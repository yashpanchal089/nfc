<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarGrad)" stroke="#86efac" stroke-width="4"/>
  
  <!-- Aura / Healing Glow Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  
  <!-- Doctor Figure Silhouette -->
  <!-- Shoulders / Apron / Holistic Attire -->
  <path d="M 40,185 C 40,140 65,128 100,128 C 135,128 160,140 160,185 Z" fill="url(#coatGrad)" stroke="#166534" stroke-width="2"/>
  
  <!-- Lapel / Collar of Apron -->
  <path d="M 82,128 L 100,165 L 118,128" fill="#15803d" opacity="0.15"/>
  <path d="M 85,128 L 100,158 L 74,185" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <path d="M 115,128 L 100,158 L 126,185" fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <!-- Neck -->
  <rect x="91" y="105" width="18" height="25" rx="6" fill="#fde68a"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="32" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- Hair / Professional Styling -->
  <path d="M 68,80 C 68,52 82,42 100,42 C 118,42 132,52 132,80 C 124,65 112,60 100,60 C 88,60 76,65 68,80 Z" fill="#1f2937"/>
  <path d="M 68,80 C 65,95 72,112 76,115 C 74,102 74,90 76,82 Z" fill="#1f2937"/>
  <path d="M 132,80 C 135,95 128,112 124,115 C 126,102 126,90 124,82 Z" fill="#1f2937"/>

  <!-- Bindi / Third Eye Chakra Spot -->
  <circle cx="100" cy="74" r="2.2" fill="#dc2626"/>

  <!-- Healing Stethoscope / Lotus Pendant -->
  <path d="M 85,138 C 85,155 115,155 115,138" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="156" r="6" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <circle cx="100" cy="156" r="2.5" fill="#f59e0b"/>

  <!-- Small Naturopathy Leaf on Badge -->
  <g transform="translate(140, 140) scale(0.6)">
    <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 0,-15 C -6,0 -12,8 0,16 C 12,8 6,0 0,-15 Z" fill="#16a34a"/>
  </g>
</svg>
